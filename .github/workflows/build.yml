# Build amk from a clean tree, smoke it and its image, and keep both as workflow artifacts; ci.yml and release.yml call this, then test.yml.
name: Build
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  # One build of the default engine set; its artifacts keep the default name test.yml and release.yml download.
  build:
    name: Build amk
    runs-on: ubuntu-24.04
    steps:
      # The Makefile reads the version from the nearest v-tag, so the checkout needs the tags and the history behind them.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Every input is pinned by digest in the Makefile, so the Makefile is the cache key; the fallback shares the toolchain across Makefile edits.
      - name: Cache downloads and toolchain
        uses: actions/cache@v6
        with:
          path: |
            *.tar.gz
            *.tar.xz
            *.zip
            *.ape
            json.bash-*
            cosmocc
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-
      # The cosmos tools have no per-file mirror, so a missing one comes out of the release zip GitHub hosts; verify checks the digest either way.
      - name: Fetch cosmos tools from the GitHub mirror
        run: |
          v=$(make -s -f Makefile --eval='v: ; @echo $(cosmos.version)' v)
          missing=$(for t in sed bash; do [ -f "$t-$v.ape" ] || echo "$t"; done)
          [ -z "$missing" ] && exit 0
          curl -fsSL --retry 3 -o cosmos.zip.part "https://github.com/jart/cosmopolitan/releases/download/$v/cosmos-$v.zip"
          for t in $missing; do unzip -p cosmos.zip.part "bin/$t" > "$t-$v.ape"; done
          rm cosmos.zip.part
      - name: Fetch and verify inputs
        run: make deps
      - name: Unpack and patch
        run: make patch
      - name: Build
        run: make build
      - name: Smoke
        run: make smoke
      # The image is the same artifact assimilated per arch; smoke runs inside it, so this proves the amd64 half, and release.yml publishes both.
      - name: Docker image
        run: make build.docker
      - name: Smoke the image
        run: make smoke.docker
      # A tarball, since upload-artifact drops the alias symlinks and the exec bits the context needs.
      - name: Pack the image context
        run: tar -C build/docker -cf docker-context.tar amd64 arm64
      - name: Upload the image context
        uses: actions/upload-artifact@v7
        with:
          name: docker-context-default
          path: docker-context.tar
          if-no-files-found: error
          retention-days: 14
      - name: Land the deliverable
        run: |
          mkdir -p dist
          install -m 0755 out/bin/amk dist/amk
      # The portable job runs the wasm checks against the modules wasm3 ships, so they travel with the binary.
      - name: Add the wasm test modules
        run: |
          install -m 0644 src/wasm3-*/test/wasi/simple/test.wasm dist/test.wasm
          install -m 0644 src/wasm3-*/test/lang/fib32.wasm dist/fib32.wasm
      - name: Upload amk
        uses: actions/upload-artifact@v7
        with:
          name: amk-default
          path: dist/*
          if-no-files-found: error
          retention-days: 14
