# Build amk from a clean tree, smoke and test it, and keep it as a workflow artifact; release.yml calls this.
name: Build
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [ "main" ]
    paths-ignore: ['**.md', '**.png', '**.svg']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['**.md', '**.png', '**.svg']
permissions:
  contents: read
jobs:
  # One build per engine set: the default, and the default with the opt-in engine added.
  build:
    name: Build amk (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [ default, wasm3 ]
        include:
          - name: default
            with: ''
          - name: wasm3
            with: wasm3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Every input is pinned by digest in the Makefile, so the Makefile is the cache key; the fallback shares the toolchain across engine sets.
      - name: Cache downloads and toolchain
        uses: actions/cache@v6
        with:
          path: |
            *.tar.gz
            *.tar.xz
            *.zip
            cosmocc
          key: deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Fetch and verify inputs
        run: make deps with=${{ matrix.with }}
      - name: Unpack and patch
        run: make patch with=${{ matrix.with }}
      - name: Build
        run: make build with=${{ matrix.with }}
      - name: Smoke
        run: make smoke with=${{ matrix.with }}
      # The suite needs pytest and nothing else; the Makefile runs it as python3 -m pytest when no pytest is on PATH.
      - name: Install pytest
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest
      - name: Test
        run: make test with=${{ matrix.with }}
      # The image is the same artifact assimilated per arch; smoke runs inside it, so this proves the amd64 half, and release.yml publishes both.
      - name: Docker image
        run: make build.docker with=${{ matrix.with }}
      - name: Smoke the image
        run: make smoke.docker with=${{ matrix.with }}
      # A tarball, since upload-artifact drops the alias symlinks and the exec bits the context needs.
      - name: Pack the image context
        run: tar -C build/docker -cf docker-context.tar amd64 arm64
      - name: Upload the image context
        uses: actions/upload-artifact@v7
        with:
          name: docker-context-${{ matrix.name }}
          path: docker-context.tar
          if-no-files-found: error
          retention-days: 14
      - name: Land the deliverable
        run: |
          mkdir -p dist
          install -m 0755 out/bin/amk dist/amk
      # The portable job runs the wasm checks against the modules wasm3 ships, so they travel with the binary.
      - name: Add the wasm test modules
        if: matrix.with == 'wasm3'
        run: |
          install -m 0644 src/wasm3-*/test/wasi/simple/test.wasm dist/test.wasm
          install -m 0644 src/wasm3-*/test/lang/fib32.wasm dist/fib32.wasm
      - name: Upload amk
        uses: actions/upload-artifact@v7
        with:
          name: amk-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # One file runs everywhere: prove it on hosts that never built it.
  portable:
    name: Run ${{ matrix.name }} on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-latest ]
        name: [ default, wasm3 ]
        include:
          - name: default
            with: ''
            features: awk jq lua s7 micropy js
          - name: wasm3
            with: wasm3
            features: awk jq lua s7 micropy wasm js
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amk
        uses: actions/download-artifact@v8
        with:
          name: amk-${{ matrix.name }}
      # Artifacts drop the mode, and the bootstrap finds itself by command -v, which on macOS skips a file that is not executable.
      - name: Restore the exec bit
        run: chmod +x amk
      # A host with no ape loader registered cannot exec the file directly; sh runs the bootstrap.
      - name: Version
        run: sh ./amk --version
      - name: Builtins
        run: sh ./amk -f smoke.mk builtins engines='${{ matrix.features }}' wasm.test=test.wasm
      - name: Guests by flag
        run: |
          sh ./amk --awk 'BEGIN { print "awk by flag: ok" }'
          printf '{"n":41}' | sh ./amk --jq -c .n+1
      - name: Payload tools first on PATH
        run: sh ./amk -f smoke.mk path tools='sed bash'
      - name: wasm3 by flag
        if: matrix.with == 'wasm3'
        run: |
          sh ./amk --wasm --func fib fib32.wasm 20 2>&1 | grep -x 'Result: 6765'
