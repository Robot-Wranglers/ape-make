# Build amk from a clean tree, smoke it and its image, and keep both as workflow artifacts; ci.yml and release.yml call this, then test.yml.
name: Build
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  # One build per engine set: the default, and the default with the opt-in engine added.
  build:
    name: Build amk (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [ default, wasm3 ]
        include:
          - name: default
            with: ''
          - name: wasm3
            with: wasm3
    steps:
      # The Makefile reads the version from the nearest v-tag, so the checkout needs the tags and the history behind them.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Every input is pinned by digest in the Makefile, so the Makefile is the cache key; the fallback shares the toolchain across engine sets.
      - name: Cache downloads and toolchain
        uses: actions/cache@v6
        with:
          path: |
            *.tar.gz
            *.tar.xz
            *.zip
            cosmocc
          key: deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Fetch and verify inputs
        run: make deps with=${{ matrix.with }}
      - name: Unpack and patch
        run: make patch with=${{ matrix.with }}
      - name: Build
        run: make build with=${{ matrix.with }}
      - name: Smoke
        run: make smoke with=${{ matrix.with }}
      # The image is the same artifact assimilated per arch; smoke runs inside it, so this proves the amd64 half, and release.yml publishes both.
      - name: Docker image
        run: make build.docker with=${{ matrix.with }}
      - name: Smoke the image
        run: make smoke.docker with=${{ matrix.with }}
      # A tarball, since upload-artifact drops the alias symlinks and the exec bits the context needs.
      - name: Pack the image context
        run: tar -C build/docker -cf docker-context.tar amd64 arm64
      - name: Upload the image context
        uses: actions/upload-artifact@v7
        with:
          name: docker-context-${{ matrix.name }}
          path: docker-context.tar
          if-no-files-found: error
          retention-days: 14
      - name: Land the deliverable
        run: |
          mkdir -p dist
          install -m 0755 out/bin/amk dist/amk
      # The portable job runs the wasm checks against the modules wasm3 ships, so they travel with the binary.
      - name: Add the wasm test modules
        if: matrix.with == 'wasm3'
        run: |
          install -m 0644 src/wasm3-*/test/wasi/simple/test.wasm dist/test.wasm
          install -m 0644 src/wasm3-*/test/lang/fib32.wasm dist/fib32.wasm
      - name: Upload amk
        uses: actions/upload-artifact@v7
        with:
          name: amk-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
