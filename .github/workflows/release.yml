# Every push to main is a release, and a manual run on any branch is one too: the next version is chosen here, amk is built as it through build.yml and tested through test.yml and itest.yml, then the binary and its digest are published as a GitHub Release and the image to ghcr.
name: Release
on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths-ignore: ['**.md', '**.png', '**.svg']
permissions:
  contents: read
# One release at a time, so each run sees the tag the run before it made.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # No one names a version: it is the highest v-tag with its last number raised by one, and the tag is made only when the release is.
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Choose the next version
        id: next
        run: |
          last="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          base="${last:-v0.0.0}"
          base="${base#v}"
          next="${base%.*}.$(( ${base##*.} + 1 ))"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "highest tag ${last:-none}, releasing v${next}"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Nothing publishes until the binaries pass the tests and the demos.
  test:
    needs: build
    uses: ./.github/workflows/test.yml

  itest:
    needs: build
    uses: ./.github/workflows/itest.yml

  # The image for amd64 and arm64 from the context build.yml smoked.
  image:
    name: Publish image
    needs: [ version, test, itest ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the image context
        uses: actions/download-artifact@v8
        with:
          name: docker-context-default
      - name: Unpack the image context
        run: mkdir -p context && tar -C context -xf docker-context.tar
      # The Dockerfile copies a prebuilt executable per platform and runs nothing, so a multi-platform build needs no emulation.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amk"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --target amk \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            -f Dockerfile context

  publish:
    name: Publish release
    needs: [ version, test, itest ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amk
        uses: actions/download-artifact@v8
        with:
          name: amk-default
      # The binary's banner must name the version it ships under; a mismatch means the build did not take the chosen one.
      - name: Version matches the release
        run: sh ./amk --version | sed -n 2p | grep -E "\(amk ${VERSION}[ :]"
      - name: Stage assets
        run: |
          mkdir -p dist
          install -m 0755 amk dist/amk
          cd dist && sha256sum amk > amk.sha256
          cat amk.sha256
      - name: Release notes
        run: |
          {
            echo "amk v${VERSION}: one actually portable make with the guests linked in."
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/amk"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/amk.sha256"
            echo 'sha256sum -c amk.sha256 && chmod +x amk'
            echo '```'
            echo
            echo 'Inputs are pinned by version and digest in the Makefile at this tag.'
          } > notes.md
      # Creating the release makes the tag, on the commit this run built.
      - name: Create release
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "amk v${VERSION}" \
            --notes-file notes.md \
            dist/amk dist/amk.sha256
      # The omnibus distribution follows in a run of its own, started from the new tag, so it adds to this release and can neither delay nor fail it.
      - name: Start the omnibus run
        continue-on-error: true
        run: gh workflow run omnibus.yml --ref "v${VERSION}" -f publish=true
