# A pushed v-prefixed tag builds amk through build.yml, then publishes the binary and its digest as a GitHub Release and the image to ghcr.
name: Release
on:
  workflow_dispatch: {}
  push:
    tags: [ "v*" ]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml

  # The image for amd64 and arm64 from the context build.yml smoked; a manual run on a branch builds both and pushes nothing.
  image:
    name: Publish image (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [ default, wasm3 ]
        include:
          - name: default
            suffix: ''
            latest: latest
          - name: wasm3
            suffix: -wasm3
            latest: wasm3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download the image context
        uses: actions/download-artifact@v6
        with:
          name: docker-context-${{ matrix.name }}
      - name: Unpack the image context
        run: mkdir -p context && tar -C context -xf docker-context.tar
      # The Dockerfile copies a prebuilt executable per platform and runs nothing, so a multi-platform build needs no emulation.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          PUSH: ${{ startsWith(github.ref, 'refs/tags/v') && '--push' || '' }}
          SUFFIX: ${{ matrix.suffix }}
          LATEST: ${{ matrix.latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amk"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build ${PUSH} \
            --platform linux/amd64,linux/arm64 \
            --target amk \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            -t "${image}:${version}${SUFFIX}" \
            -t "${image}:${LATEST}" \
            -f Dockerfile context

  # A manual run on a branch is a dry run: it builds and smokes, and this job is skipped.
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download amk
        uses: actions/download-artifact@v6
        with:
          name: amk-default
      - name: Stage assets
        run: |
          mkdir -p dist
          install -m 0755 amk dist/amk
          cd dist && sha256sum amk > amk.sha256
          cat amk.sha256
      - name: Release notes
        run: |
          {
            echo "amk ${GITHUB_REF_NAME}: one actually portable make with the guests linked in."
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/amk"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/amk.sha256"
            echo 'sha256sum -c amk.sha256 && chmod +x amk'
            echo '```'
            echo
            echo 'Inputs are pinned by version and digest in the Makefile at this tag.'
          } > notes.md
      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "amk ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag \
            dist/amk dist/amk.sha256
