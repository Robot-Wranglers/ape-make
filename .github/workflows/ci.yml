# Every pull request to main: build once, then test the binaries that build kept; a push to main runs the same jobs in release.yml, which then publishes.
name: CI
on:
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['**.md', '**.png', '**.svg']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  itest:
    needs: build
    uses: ./.github/workflows/itest.yml
