# Test the binaries build.yml kept, never a fresh build: the unit suite, the integration suite, and a run on hosts that never built them; ci.yml and release.yml call this after build.yml.
name: Test
on:
  workflow_call:
    inputs:
      # The distribution build.yml kept; empty is the default one.
      dist:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  # The unit suite against the build; a test for an engine the build lacks skips itself.
  unit:
    name: Unit tests ${{ inputs.dist }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amk
        uses: actions/download-artifact@v8
        with:
          name: amk-${{ inputs.dist || 'default' }}
      - name: Restore the exec bit
        run: chmod +x amk
      # The suite needs pytest and nothing else; the Makefile runs it as python3 -m pytest when no pytest is on PATH.
      - name: Install pytest
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest
      # The downloaded binary stands in for the artifact, and -o keeps make from rebuilding it.
      - name: Unit
        run: make -o "$PWD/amk" test artifact.ape="$PWD/amk"

  # The tests that start servers, hold ports, and fetch from GitHub, one at a time; the default build covers them, since a distribution adds engines and changes none.
  integration:
    name: Integration tests
    if: inputs.dist == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amk
        uses: actions/download-artifact@v8
        with:
          name: amk-${{ inputs.dist || 'default' }}
      - name: Restore the exec bit
        run: chmod +x amk
      - name: Install pytest
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest
      - name: Integration
        run: make -o "$PWD/amk" test.integration artifact.ape="$PWD/amk"

  # One file runs everywhere: prove it on hosts that never built it.
  portable:
    name: Run ${{ inputs.dist }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amk
        uses: actions/download-artifact@v8
        with:
          name: amk-${{ inputs.dist || 'default' }}
      # Artifacts drop the mode, and the bootstrap finds itself by command -v, which on macOS skips a file that is not executable.
      - name: Restore the exec bit
        run: chmod +x amk
      # A host with no ape loader registered cannot exec the file directly; sh runs the bootstrap.
      - name: Version
        run: sh ./amk --version
      - name: Builtins
        run: sh ./amk -f smoke.mk builtins wasm.test=test.wasm
      - name: Guests by flag
        run: |
          sh ./amk --awk 'BEGIN { print "awk by flag: ok" }'
          printf '{"n":41}' | sh ./amk --jq -c .n+1
      - name: Payload tools first on PATH
        run: sh ./amk -f smoke.mk path tools='sed bash jb'
      - name: wasm3 by flag
        run: |
          sh ./amk --wasm --func fib fib32.wasm 20 2>&1 | grep -x 'Result: 6765'
      # The standard library, zlib, and the certificate bundle all load from the payload, with nothing from the host.
      - name: cpython by flag
        if: inputs.dist == 'omnibus'
        run: |
          sh ./amk --cpython 'import ssl, zlib; print("cpython by flag:", len(ssl.create_default_context().get_ca_certs()) > 100)' | grep -x 'cpython by flag: True'
