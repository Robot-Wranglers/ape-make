[pytest]
testpaths = .
addopts = -ra --strict-markers --strict-config -m "not integration and not upstream"
markers =
    upstream: runs GNU make's own regression suite against the binary, several minutes; left out by default, run with make test.upstream
    engines(*names): the test needs every named engine linked in; skipped on a build without one
    integration: the test starts a server, opens a port, or reaches the network; left out by default, run serially with make test.integration
    network: the test fetches from the internet; always also marked integration
